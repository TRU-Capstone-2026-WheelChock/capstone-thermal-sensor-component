name: capstone-thermal-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USERNAME: dev
        UID: 1000
        GID: 1000
    environment:
      THERMAL_SHARED_DIR: /dev/shm/thermal
      THERMAL_CONFIG_PATH: ${THERMAL_CONFIG_PATH:-/app/src/capstone_thermal_sensor/config/config.yml}
      PYTHONPATH: /app/src
    volumes:
      - .:/app:cached
      - poetry-venv:/app/.venv
      - thermal-shared:/dev/shm/thermal
    command: sleep infinity

volumes:
  poetry-venv:
  thermal-shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m
